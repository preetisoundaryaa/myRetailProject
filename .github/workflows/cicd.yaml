name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  IMAGE_NAME: myretail-app
  HELM_CHART: helm/myretail
  TERRAFORM_DIR: terraform

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest -q

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform validate

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint ${{ env.HELM_CHART }}

      - name: Render Kubernetes manifests
        run: helm template myretail ${{ env.HELM_CHART }} --namespace retail > rendered.yaml

      - name: Verify rendered manifests
        run: test -s rendered.yaml

  docker:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: validate
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: |
          echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Install YAML tooling
        run: python -m pip install pyyaml

      - name: Update Helm image tag
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          values_file = Path("helm/myretail/values.yaml")
          values = yaml.safe_load(values_file.read_text(encoding="utf-8"))
          values["image"]["repository"] = f"{os.environ['DOCKER_USERNAME']}/myretail-app"
          values["image"]["tag"] = os.environ["TAG"]
          values_file.write_text(yaml.safe_dump(values, sort_keys=False), encoding="utf-8")
          PY

      - name: Commit Helm image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/myretail/values.yaml
          git diff --cached --quiet && exit 0
          git commit -m "ci: update image tag to ${TAG} [skip ci]"
          git push
